*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  background: linear-gradient(157deg, #e7eff4, var(--desk) 55%, #c8d8e2);
}
h1, h2, p, figure { margin: 0; }

button {
  appearance: none;
  color: inherit;
  font: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled, button[aria-disabled="true"] { cursor: default; }
button:focus-visible {
  outline: 3px solid #1e6688;
  outline-offset: 2px;
  z-index: 1;
}

.studio {
  --gap: 11px;
  --sample-width: clamp(96px, 15dvh, 126px);
  --paper-grid: clamp(224px, 33dvh, 300px);
  display: grid;
  gap: var(--gap);
  width: min(100%, 460px);
  margin-inline: auto;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.docket { display: flex; align-items: baseline; gap: 11px; font-size: 11px; line-height: 1.3; }
.wordmark { font-weight: 760; letter-spacing: .12em; }
.progress { color: var(--muted); font-variant-numeric: tabular-nums; }
h1 {
  margin-top: 2px;
  font: 750 clamp(28px, 8vw, 38px) / 1.14 var(--serif);
  letter-spacing: .045em;
}
.sound {
  min-height: 44px;
  padding: 0 8px;
  border: 1px solid var(--rules);
  border-radius: 4px;
  background: #f6f9f960;
  color: var(--muted);
  font-size: 11px;
}
.sound[aria-pressed="true"] { color: var(--card); background: var(--text); }

.proof {
  display: grid;
  grid-template-columns: var(--sample-width) minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}
.sample {
  padding: 5px 7px 6px;
  border: 1px solid #99a8a4;
  border-radius: 2px 9px 2px 2px;
  background: var(--paper-fiber), var(--card);
  box-shadow: 0 2px 0 #647c812d;
  text-align: left;
}
.sample-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
  font-size: 11px;
  line-height: 1.2;
  font-weight: 750;
}
.sample-title span { color: var(--muted); font-weight: 500; }
#sample-dialog {
  width: min(calc(100% - 32px), 340px);
  max-height: calc(100% - 24px);
  padding: 12px;
  border: 1px solid #c4b798;
  border-radius: 3px;
  background: var(--paper-fiber), var(--card);
  color: var(--text);
}
#sample-dialog::backdrop { background: #22364a99; }
.sample-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.sample-bar h2 { font: 700 18px var(--serif); }
.guide {
  min-width: 0;
  padding: 3px 0 3px 11px;
  border-left: 2px solid var(--rules);
}
.instruction { font-size: 15px; font-weight: 760; line-height: 1.35; }
.notice { margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.4; }
[data-stage="preview"] .guide { border-left-color: #286186; }
[data-stage="outside"] .guide, [data-stage="failed"] .guide { border-left-color: var(--red); }
[data-stage="outside"] .instruction, [data-stage="failed"] .instruction { color: var(--red); }

.target, .paper, .stamp-shape {
  display: grid;
  grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
}
.tile { display: grid; place-items: center; aspect-ratio: 1; min-width: 0; }

.ink-mark {
  width: 100%;
  aspect-ratio: 1;
  background: var(--ink);
  -webkit-mask: var(--ink-mask) center / contain no-repeat;
  mask: var(--ink-mask) center / contain no-repeat;
  pointer-events: none;
}

.target, .paper {
  border-top: 1px solid #82979f99;
  border-left: 1px solid #82979f99;
}
.target > .tile, .paper-cell {
  position: relative;
  border-right: 1px solid #82979f99;
  border-bottom: 1px solid #82979f99;
}
.target > .tile[data-link]:where(:not([data-link=""]))::after,
.paper-cell[data-link]:where(:not([data-link=""]))::after {
  position: absolute;
  z-index: 1;
  inset: 1px;
  border: 1px solid #275b76;
  content: "";
  pointer-events: none;
}
.target > .tile[data-link="blank"]::after, .paper-cell[data-link="blank"]::after,
.target > .tile[data-link="outside"]::after, .paper-cell[data-link="outside"]::after {
  border-color: var(--red);
  border-style: dashed;
  background: repeating-linear-gradient(135deg, #9d393434 0 1px, transparent 1px 4px);
}
.target > .tile[data-link="mismatch"]::after, .paper-cell[data-link="mismatch"]::after {
  border: 2px solid var(--red);
  background: repeating-linear-gradient(135deg, #9d39342c 0 1px, transparent 1px 5px);
}

.postcard {
  position: relative;
  padding: 7px 12px 9px;
  border: 1px solid #c9bd9f;
  border-radius: 2px;
  background: var(--paper-fiber), linear-gradient(141deg, #fcf8ed, var(--card) 62%, #f1e8d4);
  box-shadow: 0 2px 0 #dfd2b3, 0 7px 14px #22364a1f;
}
.postcard::after {
  position: absolute;
  inset: auto 0 -5px;
  height: 5px;
  background: var(--paper-edge) left top / 192px 8px repeat-x;
  content: "";
  pointer-events: none;
}
.paper-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  justify-content: space-between;
  min-height: 21px;
  margin-bottom: 5px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .08em;
}
.remaining {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  white-space: nowrap;
}
.print-area { position: relative; width: min(100%, var(--paper-grid)); margin-inline: auto; }
.paper-cell { padding: 0; background: transparent; }
.paper-cell:focus-visible { outline-offset: -3px; }
.paper-cell:active:not(:disabled) { background: #9a845a20; }
.ghost { position: absolute; inset: 0; pointer-events: none; }
.ghost:not([data-ink=""]) { background: #e3edf15c; }
.ghost .ink-mark { opacity: .62; }
[data-layer="cover"] .ghost::after, [data-layer="hole"] .ghost::after {
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 8px;
  height: 8px;
  content: "";
}
[data-layer="cover"] .ghost {
  background: repeating-linear-gradient(135deg, #f7eed26e 0 4px, #8b5e2552 4px 5px);
}
[data-layer="cover"] .ghost::after {
  border-top: 2px solid #7b4d13;
  border-bottom: 2px solid #7b4d13;
  transform: rotate(-32deg);
}
[data-layer="hole"] .ghost::after {
  border: 2px dotted var(--text);
  border-radius: 50%;
}

.footprint {
  position: absolute;
  z-index: 2;
  outline: 2px dashed #286186;
  outline-offset: -2px;
  pointer-events: none;
}
.footprint::before {
  position: absolute;
  inset: 0 auto auto 0;
  width: 9px;
  height: 9px;
  border-top: 3px solid #286186;
  border-left: 3px solid #286186;
  content: "";
}
.footprint span { display: none; }
.footprint.outside { outline-color: var(--red); }
.footprint.outside::before { border-color: var(--red); }
.footprint.outside span {
  display: block;
  position: absolute;
  right: 2px;
  bottom: 2px;
  padding: 1px 3px;
  color: #fff8ee;
  background: var(--red);
  font-size: 10px;
  font-weight: 750;
}

.stamps { display: grid; grid-template-columns: repeat(var(--stamp-columns), minmax(0, 1fr)); gap: 5px; }
.stamp {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  align-items: center;
  gap: 7px;
  min-height: 48px;
  padding: 4px 7px;
  text-align: left;
  border: 1px solid var(--rules);
  border-radius: 4px;
  background: #f5f8f7;
  box-shadow: inset 0 -2px 0 #3b576819;
}
.stamp[aria-pressed="true"] {
  border-color: var(--text);
  background: #f9f7eb;
  box-shadow: inset 0 -3px 0 #2c577c;
}
.stamp:disabled { border-style: dashed; color: var(--muted); background: #e1eaed; box-shadow: none; }
.stamp:disabled .stamp-shape { opacity: .6; }
.stamp:active:not(:disabled) { background: #e7edef; }
.stamp-caption { display: grid; line-height: 1.16; }
.stamp-label { overflow-wrap: anywhere; font-size: 12px; font-weight: 750; }
.stamp-flag { color: var(--muted); font-size: 10px; white-space: nowrap; }
.stamp-flag:empty { display: none; }
.stamp-shape {
  width: 32px;
  height: 32px;
  place-content: center;
  grid-template-columns: repeat(var(--columns), var(--stamp-unit));
  border: 1px solid #b08c5e;
  border-radius: 3px;
  background: var(--endgrain) center / cover, linear-gradient(156deg, #f4e4c6, #e2c79d);
  box-shadow: 0 2px 0 #ac8152, inset 0 1px #fff4d6;
}
.stamp-shape > [data-ink=""] {
  outline: 1px dotted #796d5587;
  outline-offset: -1px;
  background: #7f592e23;
}

[data-status="won"] .paper, [data-status="won"] .paper-cell { border-color: transparent; }
.postmark {
  padding: 1px 4px;
  border: 3px double var(--red);
  color: var(--red);
  transform: rotate(-6deg);
  font: 750 12px / 1.15 var(--serif);
}

.actions { display: flex; gap: 5px; }
.action {
  flex: 0 0 50px;
  min-height: 46px;
  padding: 3px 5px;
  border: 1px solid var(--rules);
  border-radius: 4px;
  background: #f3f7f7;
  font-size: 13px;
  font-weight: 720;
  white-space: nowrap;
}
.action:disabled { color: #506572; background: #dce6eb; }
.primary {
  flex: 1 1 auto;
  border-color: #86302c;
  background: var(--red);
  color: #fffaf0;
  font-size: 15px;
}
.primary[aria-disabled="true"] {
  border-color: var(--rules);
  color: var(--muted);
  background: #d5e1e7;
}
.action:active:not(:disabled):not([aria-disabled="true"]) { filter: brightness(.9); }

.stamp-contact {
  position: absolute;
  z-index: 3;
  border: 1px solid #805936;
  border-radius: 3px;
  background: var(--endgrain) center / cover, #c2a27e;
  box-shadow: 0 3px 0 #795b45, 0 7px 12px #22364a4d;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  #press { transition: transform 90ms ease-out; }
  #press:active[aria-disabled="false"] { transform: translateY(2px); }
  .stamp-contact { animation: stamp-contact 128ms cubic-bezier(.27, .62, .37, 1) both; }
  @keyframes stamp-contact {
    0% { transform: translateY(-5px) scale(1.045); opacity: .66; }
    43% { transform: translateY(1px) scale(.992); opacity: .94; }
    58% { transform: translateY(0) scale(1); opacity: .78; }
    100% { transform: translateY(-3px) scale(1.015); opacity: 0; }
  }
  .just-printed { animation: stamp-in 124ms 56ms ease-out both; }
  @keyframes stamp-in {
    from { opacity: .28; }
    to { opacity: 1; }
  }
  [data-status="won"] .postmark { animation: postmark-in 196ms 180ms ease-out both; }
  @keyframes postmark-in {
    from { opacity: 0; transform: rotate(-9deg) scale(1.15); }
    to { opacity: 1; transform: rotate(-6deg) scale(1); }
  }
}

@media (max-height: 620px) and (min-width: 320px) {
  .studio {
    --gap: 6px;
    --sample-width: 92px;
    --paper-grid: 224px;
    padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
      max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .proof { gap: 10px; }
  .sample { padding: 4px 6px 5px; }
  .postcard {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--paper-grid) minmax(0, 1fr);
    gap: 4px;
    padding: 5px 6px;
  }
  .paper-heading {
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 0;
    letter-spacing: 0;
  }
  .remaining { font-size: 9px; }
  .postmark { padding: 3px 2px; writing-mode: vertical-rl; font-size: 11px; }
  .stamp { gap: 5px; padding: 3px 4px; }
  .stamp, .action { min-height: 44px; }
}
</style>
</head>
<body>
  <main id="studio" class="studio" aria-labelledby="level-title">
    <header class="masthead">
      <div>
        <p class="docket"><span class="wordmark">落印邮局</span><span id="progress" class="progress"></span></p>
        <h1 id="level-title"></h1>
      </div>
      <button id="sound" class="sound" type="button" aria-label="盖印声音" aria-pressed="false">声音关</button>
    </header>

    <section class="proof" aria-label="小样与提示">
      <button id="sample-open" class="sample" type="button" aria-label="放大小样" aria-haspopup="dialog">
        <span class="sample-title">小样 <span aria-hidden="true">＋</span></span>
        <span id="target" class="target" role="img"></span>
      </button>
      <div class="guide" role="status" aria-atomic="true">
        <p id="instruction" class="instruction"></p>
        <p id="notice" class="notice"></p>
      </div>
    </section>

    <figure id="postcard" class="postcard">
      <figcaption class="paper-heading">
        <span id="paper-title">印纸</span>
        <span id="remaining" class="remaining"></span>
        <span id="imprint" class="postmark" hidden>已盖好</span>
      </figcaption>
      <div class="print-area">
        <div id="paper" class="paper" role="group" aria-label="印纸，可用方向键选格"></div>
        <div id="footprint" class="footprint" aria-hidden="true" hidden><span>出界</span></div>
        <div id="impression" aria-hidden="true"></div>
      </div>
    </figure>

    <section id="stamps" class="stamps" aria-label="印章"></section>

    <div class="actions" role="group" aria-label="印纸操作">

k":["010","101"]},{"id":"bin-rack","label":"仓栏","ink":"green","mask":["10001","10001","11111"]}],"instruction":""},{"id":"last-dispatch-bag","title":"终班邮袋","size":5,"target":[["gold","gold","blue",null,null],["green","green","green","green","green"],["green","blue",null,"red","green"],["green","green","green","green","green"],[null,"red",null,"blue","blue"]],"stamps":[{"id":"left-letter","label":"左信","ink":"gold","mask":["11","01","01"]},{"id":"left-mark","label":"左纹","ink":"blue","mask":["110","011"]},{"id":"right-letter","label":"右信","ink":"blue","mask":["10","10","11"]},{"id":"right-mark","label":"右纹","ink":"red","mask":["001","011","100"]},{"id":"joining-window","label":"合窗","ink":"green","mask":["111","101","101","101","111"]}],"instruction":""}]</script>
  <script>
"use strict";
(() => {
function createRound(size) {
  return {
    paper: Array.from({ length: size }, () => Array(size).fill(null)),
    history: [],
  };
}

function orientMask(mask, turns) {
  for (let turn = 0; turn < turns; turn += 1) {
    mask = Array.from({ length: mask[0].length }, (_, column) => (
      mask.map((line) => line[column]).reverse().join("")
    ));
  }
  return mask;
}

function fitsPaper(size, mask, row, column) {
  return row >= 0 && column >= 0 && row + mask.length <= size && column + mask[0].length <= size;
}

function isUsed(round, stampId) {
  return round.history.some((entry) => entry.stampId === stampId);
}

function roundStatus(level, round) {
  if (level.target.every((line, row) => line.every((ink, column) => round.paper[row][column] === ink))) {
    return "won";
  }
  return round.history.length === level.stamps.length ? "failed" : "playing";
}

function applyStamp(level, round, { stampId, row, column, turns }) {
  const stamp = level.stamps.find((entry) => entry.id === stampId);
  if (!stamp || isUsed(round, stampId) || roundStatus(level, round) !== "playing") return round;

  const mask = orientMask(stamp.mask, turns);
  if (!fitsPaper(level.size, mask, row, column)) return round;

  const paper = round.paper.map((line) => line.slice());
  mask.forEach((line, y) => {
    for (let x = 0; x < line.length; x += 1) {
      if (line[x] === "1") paper[row + y][column + x] = stamp.ink;
    }
  });

  return { paper, history: [...round.history, { stampId, paper: round.paper }] };
}

function undoStamp(round) {
  const last = round.history.at(-1);
  if (!last) return round;
  return { paper: last.paper, history: round.history.slice(0, -1) };
}

const levels = JSON.parse(document.querySelector("#levels").textContent);
const inkNames = { blue: "钴蓝", red: "朱红", green: "松绿", gold: "赭金" };
const studio = document.querySelector("#studio");
const levelTitle = document.querySelector("#level-title");
const progress = document.querySelector("#progress");
const instruction = document.querySelector("#instruction");
const notice = document.querySelector("#notice");
const target = document.querySelector("#target");
const sampleButton = document.querySelector("#sample-open");
const sampleDialog = document.querySelector("#sample-dialog");
const largeTarget = document.querySelector("#large-target");
const tray = document.querySelector("#stamps");
const paper = document.querySelector("#paper");
const paperTitle = document.querySelector("#paper-title");
const remaining = document.querySelector("#remaining");
const footprint = document.querySelector("#footprint");
const impression = document.querySelector("#impression");
const imprint = document.querySelector("#imprint");
const undoButton = document.querySelector("#undo");
const rotateButton = document.querySelector("#rotate");
const resetButton = document.querySelector("#reset");
const pressButton = document.querySelector("#press");
const nextButton = document.querySelector("#next");
const soundButton = document.querySelector("#sound");
const pressSound = document.querySelector("#press-sound");
const seenLevels = new Set();
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let levelIndex;
let level;
let round;
let intro;
let selected;
let turns;
let anchor;
let cells;
let sampleCells;
let stampButtons;
let activeCell;
let nextPointer = null;

function inkTile(ink, tag = "span") {
  const tile = document.createElement(tag);
  tile.className = "tile";
  tile.dataset.ink = ink ?? "";
  const mark = document.createElement("span");
  mark.className = "ink-mark";
  mark.setAttribute("aria-hidden", "true");
  tile.append(mark);
  return tile;
}

function setActiveCell(index) {
  cells[activeCell].tabIndex = -1;
  activeCell = index;
  cells[index].tabIndex = 0;
}

function clearPlacement() {
  selected = null;
  turns = 0;
  anchor = null;
}

function loadLevel(index, message) {
  levelIndex = index;
  level = levels[index];
  round = createRound(level.size);
  clearPlacement();
  levelTitle.textContent = level.title;
  progress.textContent = `第 ${index + 1} 张 / ${levels.length}`;
  intro = seenLevels.has(level.id) ? "" : level.instruction;
  seenLevels.add(level.id);
  target.style.setProperty("--columns", level.size);
  paper.style.setProperty("--columns", level.size);
  tray.style.setProperty("--stamp-columns", level.stamps.length > 4 ? 3 : 2);

  const sampleInk = [];
  sampleCells = level.target.flatMap((line, row) => line.map((ink, column) => {
    if (ink) sampleInk.push(`第${row + 1}行第${column + 1}列${inkNames[ink]}`);
    return inkTile(ink);
  }));
  target.replaceChildren(...sampleCells);
  target.setAttribute("aria-label", `小样：${sampleInk.join("，")}。其余格留白。`);

  stampButtons = level.stamps.map((stamp) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "stamp";
    button.dataset.stamp = stamp.id;
    const shape = document.createElement("span");
    shape.className = "stamp-shape";
    shape.setAttribute("aria-hidden", "true");
    const label = document.createElement("span");
    label.className = "stamp-label";
    label.textContent = stamp.label;
    const flag = document.createElement("span");
    flag.className = "stamp-flag";
    const caption = document.createElement("span");
    caption.className = "stamp-caption";
    caption.append(label, flag);
    button.append(shape, caption);
    button.addEventListener("click", (event) => {
      if (selected !== stamp) turns = 0;
      selected = stamp;
      intro = "";
      render();
      if (event.detail === 0) cells[activeCell].focus({ preventScroll: true });
    });
    return { button, stamp, shape, flag };
  });
  tray.replaceChildren(...stampButtons.map(({ button }) => button));

  cells = round.paper.flatMap((line, row) => line.map((ink, column) => {
    const button = inkTile(ink, "button");
    button.classList.add("paper-cell");
    button.type = "button";
    button.tabIndex = -1;
    button.dataset.row = row;
    button.dataset.column = column;
    const ghost = inkTile(null);
    ghost.classList.add("ghost");
    ghost.setAttribute("aria-hidden", "true");
    button.append(ghost);
    button.addEventListener("click", () => {
      setActiveCell(row * level.size + column);
      if (selected) anchor = { row, column };
      render();
    });
    return button;
  }));
  activeCell = 0;
  cells[0].tabIndex = 0;
  paper.replaceChildren(...cells);
  render(message);
}

function positionOnPaper(element, row, column, mask) {
  const unit = 100 / level.size;
  element.style.left = `${column * unit}%`;
  element.style.top = `${row * unit}%`;
  element.style.width = `${Math.min(mask[0].length, level.size - column) * unit}%`;
  element.style.height = `${Math.min(mask.length, level.size - row) * unit}%`;
}

function render(message, printed) {
  const hasWhiteError = round.paper.some((line, row) => line.some((ink, column) =>
    ink !== null && level.target[row][column] === null
  ));
  const status = hasWhiteError ? "failed" : roundStatus(level, round);
  const won = status === "won";
  const canPlay = status === "playing";
  const mask = selected && orientMask(selected.mask, turns);
  const fits = !!anchor && fitsPaper(level.size, mask, anchor.row, anchor.column);
  const count = level.stamps.length - round.history.length;
  const hasNext = levelIndex + 1 < levels.length;
  const previewCounts = { cover: 0, blank: 0, undercoat: 0, hole: 0 };
  const mismatches = [];
  studio.dataset.status = status;
  if (!won) nextPointer = null;
  tray.hidden = won;
  paperTitle.textContent = won ? "成品" : "印纸";
  remaining.hidden = won;
  remaining.textContent = `余 ${count} 枚`;
  imprint.hidden = !won;

  for (const { button, stamp, shape, flag } of stampButtons) {
    const used = isUsed(round, stamp.id);
    const picked = stamp === selected;
    const angle = picked ? turns : 0;
    button.setAttribute("aria-pressed", String(picked));
    button.disabled = !canPlay || used;
    flag.textContent = used ? "已用" : picked ? `已选 ${turns * 90}°` : "";
    if (button.dataset.turns !== String(angle)) {
      const shapeMask = picked ? mask : stamp.mask;
      button.dataset.turns = angle;
      shape.style.setProperty("--columns", shapeMask[0].length);
      const longSide = Math.max(shapeMask.length, shapeMask[0].length);
      shape.style.setProperty("--stamp-unit", `${Math.min(13, Math.floor(28 / longSide))}px`);
      shape.replaceChildren(...shapeMask.flatMap((line) => [...line].map((bit) => inkTile(bit === "1" ? stamp.ink : null))));
    }
  }

  for (const button of cells) {
    const row = Number(button.dataset.row);
    const column = Number(button.dataset.column);
    const ink = round.paper[row][column];
    const expected = level.target[row][column];
    const bit = anchor && mask[row - anchor.row]?.[column - anchor.column];
    const preview = bit === "1" ? selected.ink : "";
    const cover = !!preview && fits && ink !== null;
    const hole = bit === "0" && fits && ink !== null;
    const mismatch = status === "failed" && ink !== expected && (!hasWhiteError || expected === null);
    if (mismatch) mismatches.push({ row, column });
    let link = mismatch ? "mismatch" : "";
    if (hole) {
      link = "preview";
      previewCounts.hole += 1;
    } else if (preview) {
      link = "preview";
      if (!fits) link = "outside";
      else if (expected === null) link = "blank";
      if (cover) previewCounts.cover += 1;
      if (expected === null) previewCounts.blank += 1;
      else if (expected !== preview) previewCounts.undercoat += 1;
    }
    sampleCells[row * level.size + column].dataset.link = link;
    button.dataset.link = link;
    button.dataset.layer = hole ? "hole" : cover ? "cover" : "";
    button.dataset.ink = ink ?? "";
    button.firstElementChild.classList.toggle("just-printed", printed?.mask[row - printed.row]?.[column - printed.column] === "1");
    button.lastElementChild.dataset.ink = preview;
    button.disabled = !canPlay;
    const previewLabel = preview ? `，${cover ? "覆盖为" : "预印"}${inkNames[preview]}，小样${inkNames[expected] ?? "留白"}` :
      hole ? "，孔内保留旧墨" : "";
    const mismatchLabel = mismatch ? `，不符，小样${inkNames[expected] ?? "留白"}` : "";
    button.setAttribute("aria-label", `第${row + 1}行第${column + 1}列，${inkNames[ink] ?? "留白"}${previewLabel}${mismatchLabel}`);
  }

  footprint.hidden = !anchor;
  footprint.classList.toggle("outside", !!anchor && !fits);
  if (anchor) positionOnPaper(footprint, anchor.row, anchor.column, mask);
  impression.replaceChildren();
  if (printed && !reducedMotion.matches) {
    const block = document.createElement("span");
    block.className = "stamp-contact";
    positionOnPaper(block, printed.row, printed.column, printed.mask);
    block.addEventListener("animationend", () => block.remove(), { once: true });
    impression.append(block);
  }

  undoButton.disabled = round.history.length === 0;
  rotateButton.hidden = won;
  rotateButton.disabled = !selected;
  pressButton.hidden = won;
  pressButton.setAttribute("aria-disabled", String(!canPlay || !fits));
  nextButton.hidden = !won;
  nextButton.textContent = hasNext ? "下一张" : "再印一套";

  const [stage, heading, hint] = getFeedback(status, fits, previewCounts, mismatches, hasWhiteError);
  studio.dataset.stage = stage;
  if (instruction.textContent !== heading) instruction.textContent = heading;
  const nextNotice = message ?? hint;
  if (notice.textContent !== nextNotice) notice.textContent = nextNotice;
}

function atCell({ row, column }) {
  return `第${row + 1}行第${column + 1}列`;
}

function getFeedback(status, fits, counts, mismatches, hasWhiteError) {
  if (status === "won") {
    return ["won", "盖好了", "印色和留白都对上了。"];
  }
  if (status === "failed") {
    const first = mismatches[0];
    const at = atCell(first);
    if (hasWhiteError) return ["failed", "留白处沾墨", `${at}应留白。撤销这枚章再试。`];
    const expected = inkNames[level.target[first.row][first.column]];
    return ["failed", `${mismatches.length} 格与小样不符`, `${at}应印${expected}。可撤销或重印。`];
  }
  if (!selected) return ["choose", "先选一枚章", intro];
  const angle = turns ? ` ${turns * 90}°` : "";
  if (!anchor) {
    return ["place", `已选「${selected.label}」${angle}`, "点一下印纸，摆出预览。"];
  }
  if (!fits) return ["outside", "章框出界", "换个纸格或旋转印章。"];
  const notes = [];
  if (counts.cover) notes.push(`覆盖 ${counts.cover} 格旧墨`);
  if (counts.blank) notes.push(`留白误印 ${counts.blank} 格`);
  else if (counts.hole) notes.push(`孔内留墨 ${counts.hole} 格`);
  else if (counts.undercoat) notes.push("底墨可再叠盖");
  return ["preview", atCell(anchor) + angle, notes.length ? notes.join("，") + "。" : "位置合适就按盖章。"];
}

sampleButton.addEventListener("click", () => {
  largeTarget.style.setProperty("--columns", level.size);
  largeTarget.setAttribute("aria-label", target.getAttribute("aria-label"));
  largeTarget.replaceChildren(...sampleCells.map((cell) => cell.cloneNode(true)));
  sampleDialog.showModal();
});

paper.addEventListener("keydown", (event) => {
  const step = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[event.key];
  if (!step) return;
  event.preventDefault();
  const row = Math.floor(activeCell / level.size) + step[0];
  const column = activeCell % level.size + step[1];
  if (!fitsPaper(level.size, ["1"], row, column)) return;
  setActiveCell(row * level.size + column);
  cells[activeCell].focus();
});

rotateButton.addEventListener("click", () => {
  turns = (turns + 1) % 4;
  render();
});

pressButton.addEventListener("click", (event) => {
  if (pressButton.getAttribute("aria-disabled") === "true") return;
  const next = applyStamp(level, round, { stampId: selected.id, turns, ...anchor });
  if (round === next) return;
  const printed = { mask: orientMask(selected.mask, turns), ...anchor };
  round = next;
  clearPlacement();
  render(undefined, printed);
  const status = studio.dataset.status;
  if (status === "playing") notice.textContent = "已落印。再选一枚章。";
  if (event.detail === 0 && status === "playing") {
    stampButtons.find(({ button }) => !button.disabled).button.focus({ preventScroll: true });
  }
  if (event.detail === 0 && status === "failed") undoButton.focus({ preventScroll: true });
  if (event.detail === 0 && status === "won") nextButton.focus({ preventScroll: true });
  if (soundButton.getAttribute("aria-pressed") === "true") {
    if (pressSound.readyState) pressSound.currentTime = 0;
    void pressSound.play().catch(() => {});
  }
});

nextButton.addEventListener("pointerdown", (event) => {
  if (event.isPrimary && event.button === 0 && !nextButton.hidden) nextPointer = event.pointerId;
});

nextButton.addEventListener("pointercancel", () => { nextPointer = null; });

nextButton.addEventListener("keydown", (event) => {
  if (event.repeat && (event.key === "Enter" || event.key === " ")) event.preventDefault();
});

nextButton.addEventListener("click", (event) => {
  const freshPointer = nextPointer !== null && (event.pointerId === undefined || event.pointerId === nextPointer);
  nextPointer = null;
  // Pointer activation must start on the result button. Keyboard and assistive activation have detail 0.
  if (nextButton.hidden || (event.detail > 0 && !freshPointer)) return;
  loadLevel((levelIndex + 1) % levels.length);
  stampButtons[0].button.focus({ preventScroll: true });
});

undoButton.addEventListener("click", () => {
  round = undoStamp(round);
  clearPlacement();
  render("已撤销，印章已返还。");
  if (undoButton.disabled) stampButtons[0].button.focus({ preventScroll: true });
});

resetButton.addEventListener("click", () => {
  loadLevel(levelIndex, "纸面已清空。先选一枚印章。");
});

soundButton.addEventListener("click", () => {
  const enabled = soundButton.getAttribute("aria-pressed") !== "true";
  soundButton.setAttribute("aria-pressed", String(enabled));
  soundButton.textContent = enabled ? "声音开" : "声音关";
  if (!enabled) pressSound.pause();
});

loadLevel(0);
})();
</script>
