<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d7e4ec">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>落印邮局 · 骑缝章</title>
<style>
:root {
  color-scheme: light;
  --desk: #d7e4ec;
  --paper: #fbf5e4;
  --type: #22384b;
  --muted: #425b68;
  --line: #9aadb0;
  --seam: #6f8998;
  --red: #983832;
  --blue: #215f86;
  --green: #2a634f;
  --serif: "Songti SC", "Noto Serif CJK SC", STSong, SimSun, serif;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--type);
  background: var(--desk);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(155deg, #e9eff1, var(--desk) 65%, #c8d9e3);
}
h1, h2, h3, p, ol { margin: 0; }
button {
  appearance: none;
  border: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled { cursor: default; }
button:focus-visible { outline: 3px solid #125a82; outline-offset: 2px; z-index: 1; }

.desk {
  display: grid;
  gap: 9px;
  width: min(100%, 450px);
  margin-inline: auto;
  padding: max(12px, env(safe-area-inset-top)) max(13px, env(safe-area-inset-right))
    max(13px, env(safe-area-inset-bottom)) max(13px, env(safe-area-inset-left));
}
.mast {
  display: flex;
  gap: 8px;
  align-items: end;
  justify-content: space-between;
  border-bottom: 1px solid var(--seam);
  padding-bottom: 7px;
}
.brand h1 {
  font: 750 clamp(29px, 7.65vw, 40px) / 1.12 var(--serif);
  letter-spacing: .035em;
}
.brand small, .docket span { font-size: 12px; color: var(--muted); }
.brand small { display: block; margin-top: 2px; }
.docket { display: grid; gap: 2px; text-align: right; white-space: nowrap; font-size: 13px; }
.docket span { font-variant-numeric: tabular-nums; }
.intro { font-size: 13px; line-height: 1.4; }

.mail {
  --sheets: 3;
  display: grid;
  grid-template-columns: repeat(var(--sheets), minmax(0, 1fr));
  gap: 6px;
}
.mail:has(.ticket:nth-child(2):last-child) { --sheets: 2; }
.mail:has(.ticket:only-child) { --sheets: 1; }
.ticket {
  position: relative;
  min-height: 63px;
  padding: 5px 7px 6px;
  border: 1px solid #a5a890;
  border-radius: 2px 7px 2px 2px;
  text-align: left;
  background: var(--fiber), #f8f0da;
  box-shadow: 0 2px 0 #263f4b19;
}
.ticket[aria-pressed="true"] {
  border-color: var(--blue);
  box-shadow: inset 0 -2px 0 var(--blue), 0 2px 0 #263f4b19;
  background: var(--fiber), #fbf6e4;
}
.ticket strong { display: block; padding-right: 18px; line-height: 1.2; font-size: 15px; }
.ticket-slug {
  position: absolute;
  top: 5px;
  right: 5px;
  min-width: 17px;
  padding: 0 2px;
  border-radius: 2px;
  background: var(--blue);
  color: white;
  font-size: 11px;
  line-height: 1.45;
  text-align: center;
}
.wishes { gap: 1px; margin-top: 3px; display: grid; color: var(--muted); font-size: 11px; line-height: 1.22; }
.incoming { min-height: 16px; display: flex; flex-wrap: wrap; gap: 3px 8px; color: var(--muted); font-size: 11.5px; }
.incoming b { color: var(--type); }

.station { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.station::before {
  content: "";
  position: absolute;
  left: calc(50% - .5px);
  top: 9px;
  bottom: 48px;
  border-left: 1px dashed var(--seam);
}
.sheet, .receipt {
  position: relative;
  min-width: 0;
  padding-top: 5px;
  border: 1px solid #a6aa90;
  border-radius: 2px;
  background: var(--fiber), linear-gradient(145deg, #fffaed, var(--paper) 70%, #f3e8ca);
  box-shadow: 0 2px 0 #425a5725;
}
.sheet::after, .receipt::after {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: auto 1px 0;
  height: 3px;
  background: var(--deckle) left bottom / 146px 4px repeat-x;
  opacity: .65;
}
.sheet[data-empty="true"] {
  border-color: #93a6ad;
  border-style: dashed;
  background: #edf3ed6b;
  box-shadow: none;
}
.sheet[data-empty="true"]::after { display: none; }
.paperhead {
  min-height: 23px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
  padding: 0 7px 3px;
}
.paperhead h3 { font: 740 15px var(--serif); }
.paperhead span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.register {
  position: relative;
  min-height: 42px;
  border-top: 1px solid #8d9d8f59;
  overflow: hidden;
}
.register.ghost { box-shadow: inset 0 0 0 1px currentColor; outline: 1px dashed #7796a31f; outline-offset: -3px; }
.register.ghost[data-risk="true"] { background: #f5e6d6; color: var(--red); }
.band, .mark-name {
  position: absolute;
  z-index: 1;
  font-size: 11px;
  line-height: 1.22;
  font-weight: 650;
}
.band { top: 4px; color: var(--muted); }
.mark-name { bottom: 4px; color: var(--type); }
[data-side="left"] .band, .mark-name[data-label="left"] { left: 6px; }
[data-side="right"] .band, .mark-name[data-label="right"] { right: 6px; }
.proof {
  position: absolute;
  top: 50%;
  translate: 0 -50%;
  display: block;
  width: min(92px, calc(100% - 37px));
  height: auto;
  mix-blend-mode: multiply;
}
.proof[data-cut="left"] { right: 0; }
.proof[data-cut="right"] { left: 0; }
.ghost .proof { opacity: .37; }
.ink .proof { opacity: .89; }
.ink.fresh .proof { animation: strike .33s ease-out both; }
@keyframes strike {
  from { opacity: .35; scale: 1.05; }
  45% { opacity: 1; scale: .994; }
  to { opacity: .89; scale: 1; }
}
.send {
  width: 100%;
  min-height: 44px;
  border-top: 1px solid #8d9d8f80;
  background: #e8e5d485;
  font-size: 13px;
  font-weight: 750;
}
.send:disabled { background: transparent; color: var(--muted); font-weight: 500; }
.send[data-ready="true"] { background: #dfebe2; color: #214f3d; }
.send[aria-expanded="true"] { background: #eee0cc; color: #643b31; }
.send:active:not(:disabled), .secondary:active:not(:disabled) { filter: brightness(.91); }

.send-confirm {
  display: grid;
  gap: 3px;
  margin-block: -2px;
  padding: 3px 6px 4px;
  border: 1px solid #aa9278;
  border-radius: 3px;
  background: var(--fiber), var(--paper);
}
.send-confirm p { font-size: 12px; line-height: 1.35; }
.send-confirm .secondary { min-height: 44px; font-size: 13px; }
.send-confirm .confirm-send { border-color: var(--red); background: #f5e4d7; color: #782e2b; }

.stamp-block { display: grid; gap: 5px; }
.stamps {
  display: grid;
  grid-template-columns: auto repeat(3, minmax(0, 1fr));
  align-items: center;
  gap: 5px;
  padding: 0;
  list-style: none;
}
.stamps li { text-align: center; white-space: nowrap; font-size: 12px; }
.stamps .stamp-label { text-align: left; color: var(--muted); font-weight: 730; padding-right: 3px; }
.stamp-item {
  border: 1px solid #9dacaa;
  border-left: 3px solid var(--ink-tone);
  border-radius: 2px;
  padding: 5px 1px;
  background: #f6f4e8ba;
}
.stamp-item[data-used="true"] { text-decoration: line-through; color: var(--muted); background: transparent; }
.stamp-item[aria-current="step"] { border-color: var(--ink-tone); font-weight: 800; color: var(--ink-tone); background: var(--paper); }
.stamp-meta { font-size: 12px; line-height: 1.35; font-weight: 750; }
.hint { min-height: 17px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.hint.risk { color: #862d29; font-weight: 750; }

.actions { display: grid; grid-template-columns: .83fr 1.4fr; gap: 8px; }
.secondary, .press {
  min-height: 46px;
  padding: 7px 8px;
  border-radius: 3px;
  font-size: 15px;
  font-weight: 760;
}
.secondary { border: 1px solid #7a939d; background: #f4f6ee; }
.secondary:disabled { color: #4b626b; background: #dbe5e6; }
.press {
  background: var(--wood), linear-gradient(174deg, #a14c38, #8e332e);
  border: 1px solid #7b3029;
  box-shadow: 0 2px 0 #642b28;
  color: #fffaeb;
  letter-spacing: .08em;
}
.press:active:not(:disabled) { translate: 0 2px; box-shadow: none; }
.press:disabled {
  color: #3e5660;
  border-color: #8aa0a5;
  background: #c6d4d5;
  box-shadow: 0 2px 0 #91a2a8;
}

.summary {
  padding: 9px 10px 8px;
  border: 1px solid #a3a988;
  border-radius: 2px 9px 2px 2px;
  background: var(--fiber), var(--paper);
}
.summary h2 { font: 750 26px / 1.25 var(--serif); }
.summary p { margin-top: 3px; font-size: 13px; color: var(--muted); }
.receipts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.receipt .paperhead span { color: var(--red); font-weight: 760; }
.receipt[data-matched="true"] .paperhead span { color: var(--green); }
.receipt .register { min-height: 37px; }
.receipt .band { top: 50%; translate: 0 -50%; }
.receipt-note { padding: 4px 7px 5px; color: var(--muted); font-size: 11px; border-top: 1px solid #8d9d8f59; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
@media (min-height: 680px) {
  .desk { gap: 11px; padding-top: max(16px, env(safe-area-inset-top)); }
  .register { min-height: 51px; }
  .ticket { min-height: 69px; padding-inline: 9px; }
}
@media (max-height: 620px) {
  .receipt .paperhead { min-height: 20px; }
  .receipt .register { min-height: 29px; }
  .receipt .proof { width: min(60px, calc(100% - 39px)); }
  .receipts { gap: 5px; }
  .receipt { padding-top: 4px; }
  .receipt-note { padding-block: 3px 4px; line-height: 1.2; }
}
@media (prefers-reduced-motion: reduce) {
  .ink.fresh .proof { animation: none; }
}
</style>

<body>
<main class="desk" id="game"></main>
<p role="status" class="sr-only" id="announce"></p>

<script id="rules">
const MARKS = {
  blank: "留白",
  sun: "朱日", cloud: "云线",
  wave: "蓝浪", swallow: "燕尾",
  ridge: "山脊", moon: "月牙"
};
const ORDERS = [
  { id: "shore", name: "海边", wish: ["sun", "wave"] },
  { id: "note", name: "白笺", wish: ["blank", "swallow"] },
  { id: "ferry", name: "渡口", wish: ["any", "wave"] },
  { id: "window", name: "晴窗", wish: ["cloud", "any"] },
  { id: "hill", name: "山邮", wish: ["ridge", "any"] }
];
const LETTERS = Object.fromEntries(ORDERS.map(letter => [letter.id, letter]));
const STAMPS = {
  clear: { name: "晴信章", row: 0, halves: ["sun", "cloud"], tone: "red" },
  tide: { name: "渡潮章", row: 1, halves: ["wave", "swallow"], tone: "blue" },
  hill: { name: "山月章", row: 0, halves: ["ridge", "moon"], tone: "green" }
};
const BAGS = [
  { name: "晴信先行", chain: ["clear", "tide", "hill"] },
  { name: "渡潮先行", chain: ["tide", "clear", "hill"] }
];
const ROWS = ["上格", "下格"];

function newBag(bag = 0) {
  return {
    bag, used: 0, desk: [null, null], sent: [],
    ink: Object.fromEntries(ORDERS.map(letter => [letter.id, [null, null]]))
  };
}

function atCounter(state) {
  return ORDERS.slice(0, state.sent.length + 3).filter(letter => !state.sent.includes(letter.id));
}

function nextStamp(state) {
  return STAMPS[BAGS[state.bag].chain[state.used]];
}

function unmet(state, id) {
  return LETTERS[id].wish.flatMap((wish, row) => {
    const actual = state.ink[id][row] ?? "blank";
    return wish === "any" || wish === actual ? [] : [row];
  });
}

function stampBlock(state) {
  const stamp = nextStamp(state);
  if (atCounter(state).length === 1) return "柜台只剩一封，寄出后即可结算。";
  if (!stamp) return "印章已用完，可以继续寄信。";
  if (state.desk.includes(null)) return "点信签选两封一起盖印，再点同一封可取回。";
  const occupied = state.desk.find(id => state.ink[id][stamp.row]);
  return occupied ? `${LETTERS[occupied].name}${ROWS[stamp.row]}已有墨，换一封再盖。` : "";
}

function applyAction(state, action, id) {
  const deskIndex = state.desk.indexOf(id);
  if (action === "stage" && atCounter(state).some(letter => letter.id === id)) {
    const space = state.desk.indexOf(null);
    if (deskIndex >= 0) return { ...state, desk: state.desk.map(placed => placed === id ? null : placed) };
    if (space >= 0) return { ...state, desk: state.desk.map((placed, index) => index === space ? id : placed) };
  }
  if (action === "swap" && !state.desk.includes(null)) {
    return { ...state, desk: [state.desk[1], state.desk[0]] };
  }
  if (action === "press" && !stampBlock(state)) {
    const stamp = nextStamp(state);
    const ink = { ...state.ink };
    state.desk.forEach((placed, side) => {
      ink[placed] = ink[placed].map((prior, row) => row === stamp.row ? stamp.halves[side] : prior);
    });
    return { ...state, ink, used: state.used + 1 };
  }
  if (action === "send" && deskIndex >= 0 && id !== null) {
    return { ...state, desk: state.desk.map(placed => placed === id ? null : placed), sent: [...state.sent, id] };
  }
  return state;
}
</script>

<script>
const ENGRAVINGS = {
  sun:     { side: "left",  tone: "#983832", body: "M100 4C83 4 69 14 69 25S83 46 100 46Z", line: "M9 26h34m5-12h11m-9 25h12m27 8h11" },
  cloud:   { side: "right", tone: "#983832", body: "", line: "M0 13h21c9 0 9-8 19-8 11 0 10 14 22 14h25M0 28h23c9 0 11-6 20-6 10 0 15 7 23 7h13M0 39h53m12 0h7" },
  wave:    { side: "left",  tone: "#215f86", body: "M8 29c27 6 40-5 49-19 6 6 7 16 3 21 14-8 26-10 40-6v13c-28-2-40 7-63 4C23 40 14 36 8 29Z", line: "M20 46c24 6 39 1 51-1 13-3 22-3 29-3" },
  swallow: { side: "right", tone: "#215f86", body: "M67 21c-7 1-14 5-18 8-9-3-22-8-29-19 3 11 12 19 21 24L16 40l13-1-2 5c9-6 15-8 24-8 11 0 16-8 22-11l6-1Z", line: "M0 42c19 0 35 5 54 2h25" },
  ridge:   { side: "left",  tone: "#2a634f", body: "M11 41 44 11l13 14 14-12 29 23v9H11Z", line: "M10 48h90" },
  moon:    { side: "right", tone: "#2a634f", body: "M46 4c-13 16-3 34 19 34-9 9-27 8-32-6C29 20 35 10 46 4Z", line: "M0 48c14-3 17-8 31-8m40-19h10m-5-5v10" }
};

const game = document.querySelector("#game");
const announce = document.querySelector("#announce");
let state = newBag();
let notice = "";
let pendingSend = null;

function requiresSendConfirmation(id) {
  return state.sent.length < ORDERS.length - 1 && Boolean(nextStamp(state)) && unmet(state, id).length > 0;
}

function sendWarning(id) {
  const incoming = ORDERS[state.sent.length + 3];
  return `寄出${LETTERS[id].name}后就不能再盖。${incoming ? `${incoming.name}会补位。` : ""}`;
}

function sendConfirmation() {
  if (!pendingSend) return "";
  return `<section class="send-confirm" id="send-confirm" data-letter="${pendingSend}" aria-label="提前寄出确认">
    <p>${sendWarning(pendingSend)}</p>
    <div class="actions">
      <button type="button" class="secondary" data-action="cancel-send" data-id="${pendingSend}">取消寄出</button>
      <button type="button" class="secondary confirm-send" data-action="confirm-send" data-id="${pendingSend}">
        确认寄出${LETTERS[pendingSend].name}</button>
    </div>
  </section>`;
}

function wishCopy(letter, rows = [0, 1]) {
  return rows.filter(row => letter.wish[row] !== "any")
    .map(row => `${ROWS[row]} ${MARKS[letter.wish[row]]}`);
}

function ticket(letter) {
  const place = state.desk.indexOf(letter.id);
  return `<button class="ticket" type="button" data-action="stage" data-id="${letter.id}"
    aria-pressed="${place >= 0}" aria-label="${letter.name}，${wishCopy(letter).join("，")}${place < 0 ? "" : place === 0 ? "，左台" : "，右台"}">
    <strong>${letter.name}</strong>${place < 0 ? "" : `<span class="ticket-slug">${place === 0 ? "左" : "右"}</span>`}
    <span class="wishes">${wishCopy(letter).map(wish => `<span>${wish}</span>`).join("")}</span>
  </button>`;
}

function register(mark, row, options = {}) {
  const { ghost = false, risk = false, fresh = false, side = "left", receipt = false } = options;
  const inkClass = ghost ? "ghost" : mark ? "ink" : "";
  const label = mark && ENGRAVINGS[mark].side === "right" ? "right" : "left";
  return `<div class="register ${inkClass}${fresh ? " fresh" : ""}" data-side="${side}"
    data-row="${row}" data-mark="${ghost ? "" : mark ?? ""}" data-risk="${risk}">
    <span class="band">${ROWS[row]}${receipt && mark ? ` ${MARKS[mark]}` : ""}</span>
    ${mark ? `<canvas class="proof" width="200" height="104" data-engraving="${mark}"
      data-cut="${ENGRAVINGS[mark].side}" aria-hidden="true"></canvas>` : ""}
    ${mark && !receipt ? `<span class="mark-name" data-label="${label}">${ghost ? "预览 " : ""}${MARKS[mark]}</span>` : ""}
  </div>`;
}

function mismatch(id, row, mark) {
  const wanted = LETTERS[id].wish[row];
  return wanted !== "any" && wanted !== mark;
}

function sheet(id, index, preview, recentlyPressed) {
  const side = index === 0 ? "left" : "right";
  const plate = index === 0 ? "左台" : "右台";
  const letter = LETTERS[id];
  const missing = id ? unmet(state, id).length : 0;
  const printed = recentlyPressed ? STAMPS[BAGS[state.bag].chain[state.used - 1]] : null;
  const rows = ROWS.map((_, row) => {
    const ghost = Boolean(preview && preview.row === row);
    const mark = ghost ? preview.halves[index] : state.ink[id]?.[row];
    return register(mark, row, {
      side, ghost, risk: ghost && mismatch(id, row, mark), fresh: printed?.row === row
    });
  }).join("");
  return `<article class="sheet" aria-label="${plate}${letter ? `，${letter.name}` : ""}"
    data-letter="${id ?? ""}" data-empty="${!id}">
    <div class="paperhead"><h3>${plate}${letter ? `　${letter.name}` : ""}</h3></div>
    ${rows}
    <button class="send" data-action="send" data-id="${id ?? ""}" data-ready="${Boolean(id && !missing)}"
      ${id && requiresSendConfirmation(id) ? `aria-expanded="${pendingSend === id}"` : ""}
      ${id && pendingSend === id ? 'aria-controls="send-confirm"' : ""}
      ${id ? `aria-label="寄出${letter.name}，${missing ? `差 ${missing} 处` : "已满足"}"` : "disabled"}>
      ${id ? `寄出 · ${missing ? `差 ${missing} 处` : "已满足"}` : "等候上台"}</button>
  </article>`;
}

function receipt(id) {
  const letter = LETTERS[id];
  const missing = unmet(state, id);
  const rows = state.ink[id].map((mark, row) => register(mark, row, {
    side: mark && ENGRAVINGS[mark].side === "right" ? "right" : "left", receipt: true
  })).join("");
  return `<article class="receipt" data-letter="${id}" data-matched="${missing.length === 0}">
    <div class="paperhead"><h3>${letter.name}</h3><span>${missing.length ? `差 ${missing.length} 处` : "已满足"}</span></div>
    ${rows}
    <p class="receipt-note">${missing.length ? wishCopy(letter, missing).join("、") : "收件人愿望已满足"}</p>
  </article>`;
}

function drawInk() {
  for (const canvas of game.querySelectorAll("canvas[data-engraving]")) {
    const { tone, body, line } = ENGRAVINGS[canvas.dataset.engraving];
    const brush = canvas.getContext("2d");
    brush.scale(2, 2);
    brush.fillStyle = tone;
    brush.strokeStyle = tone;
    brush.lineWidth = 2.3;
    brush.lineCap = "round";
    if (body) brush.fill(new Path2D(body));
    brush.stroke(new Path2D(line));
  }
}

function render(recentlyPressed = false) {
  const bag = BAGS[state.bag];
  const ready = atCounter(state);
  const done = state.sent.length === ORDERS.length;
  const matched = state.sent.filter(id => unmet(state, id).length === 0).length;
  const header = `<header class="mast">
    <div class="brand"><h1 tabindex="-1">落印邮局</h1><small>骑缝章</small></div>
    <div class="docket"><strong>第 ${state.bag + 1} 袋 · ${bag.name}</strong>
      <span>已寄 ${state.sent.length} / ${ORDERS.length}</span></div>
  </header>`;
  if (done) {
    game.innerHTML = `${header}<section class="summary" aria-label="邮袋结算">
      <h2 tabindex="-1" id="bag-result">${matched} / ${ORDERS.length} 封满足愿望</h2>
      <p>${ORDERS.length} 封都已寄出。${state.used < bag.chain.length ? `余 ${bag.chain.length - state.used} 枚章未用。` : "本袋印章已用完。"}</p>
      </section>
      <div class="actions">
        <button class="secondary" data-action="restart">再开本袋</button>
        <button class="press" data-action="next">${state.bag === 0 ? "换一袋" : "回到首袋"}</button>
      </div>
      <section class="receipts" aria-label="已寄出的明信片">${state.sent.map(receipt).join("")}</section>`;
    drawInk();
    return;
  }

  const incoming = ORDERS.slice(state.sent.length + 3);
  const stamp = nextStamp(state);
  const blocked = stampBlock(state);
  const preview = blocked ? null : stamp;
  const risks = preview ? state.desk.flatMap((id, side) => {
    return mismatch(id, preview.row, preview.halves[side])
      ? [`${LETTERS[id].name}${ROWS[preview.row]}想要${MARKS[LETTERS[id].wish[preview.row]]}`] : [];
  }) : [];
  const hint = risks.length
    ? `${risks.join("，")}。${pendingSend ? "" : "落墨后不能改。"}`
    : notice || blocked || "落墨后不能改。寄出一封，候补补上一封。";
  game.innerHTML = `${header}
    <p class="intro">让收信人尽量如愿。五封寄完即结算。</p>
    <div class="mail" role="group" aria-label="柜台信签">${ready.map(ticket).join("")}</div>
    <p class="incoming"><b>候补</b>
      ${incoming.length ? incoming.map(letter => `<span>${letter.name} ${wishCopy(letter).join("、")}</span>`).join("") : "已全部到柜台"}
    </p>
    <section class="station" aria-label="骑缝印台">
      ${state.desk.map((id, side) => sheet(id, side, preview, recentlyPressed)).join("")}
    </section>
    ${sendConfirmation()}
    <section class="stamp-block" aria-label="章序与盖印提示">
      <ol class="stamps"><li class="stamp-label">章序</li>
      ${bag.chain.map((id, index) => `<li class="stamp-item" data-used="${index < state.used}"
        ${index === state.used ? 'aria-current="step"' : ""} style="--ink-tone:var(--${STAMPS[id].tone})"
        aria-label="${STAMPS[id].name}${index < state.used ? "，已用" : ""}">${STAMPS[id].name}</li>`).join("")}</ol>
      ${pendingSend && risks.length ? "" : `<p class="stamp-meta">${stamp ? `${ROWS[stamp.row]} · 左 ${MARKS[stamp.halves[0]]} ｜ 右 ${MARKS[stamp.halves[1]]}` : "还可寄出余下的信"}</p>`}
      ${!pendingSend || risks.length ? `<p class="hint${risks.length ? " risk" : ""}">${hint}</p>` : ""}
    </section>
    <div class="actions">
      <button class="secondary" data-action="swap" ${state.desk.includes(null) ? "disabled" : ""}>左右互换</button>
      <button class="press" data-action="press" ${blocked ? "disabled" : ""}>盖章</button>
    </div>`;
  drawInk();
}

game.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  const { action: control, id = null } = button.dataset;
  if ((control === "cancel-send" || control === "confirm-send") && pendingSend !== id) return;
  const action = control === "confirm-send" ? "send" : control;
  const before = state;
  const previousStamp = nextStamp(state);
  const keepFocus = document.activeElement === button;
  notice = "";
  pendingSend = control === "send" && requiresSendConfirmation(id) ? id : null;

  if (pendingSend) {
    notice = sendWarning(pendingSend);
  } else if (action === "cancel-send") {
    notice = `已取消寄出。${stampBlock(state) || "可以继续盖印。"}`;
  } else if (action === "restart" || action === "next") {
    state = newBag(action === "restart" ? state.bag : (state.bag + 1) % BAGS.length);
    notice = `已打开${BAGS[state.bag].name}。先选两封信。`;
  } else {
    state = applyAction(state, action, id);
    if (action === "stage" && state === before) notice = "桌上已有两封。点已选的信取回一封。";
    if (action === "press") {
      const pair = state.desk.map(placed => LETTERS[placed].name).join("和");
      notice = `${previousStamp.name}已印上${pair}。${stampBlock(state)}`;
    }
    if (action === "send") {
      const incoming = ORDERS[before.sent.length + 3];
      const result = unmet(state, id).length ? "带着差异" : "已满足";
      notice = `${LETTERS[id].name}${result}寄出。${incoming ? `${incoming.name}补位。` : ""}`;
    }
  }

  render(action === "press");
  const result = document.querySelector("#bag-result");
  if (result) {
    result.focus({ preventScroll: true });
    announce.textContent = `${notice}${result.textContent}`;
    return;
  }
  const hint = document.querySelector(".hint")?.textContent ?? "";
  announce.textContent = notice === hint ? hint : `${notice}${hint}`;
  if (keepFocus) {
    const focusAction = action === "cancel-send" ? "send" : control;
    const repeat = [...game.querySelectorAll("button:not(:disabled)")].find(candidate =>
      candidate.dataset.action === focusAction && (candidate.dataset.id ?? null) === id);
    const fallback = game.querySelector(control === "confirm-send" ? "h1" : ".ticket");
    (repeat ?? fallback)?.focus({ preventScroll: true });
  }
});

render();
</script>
</body>
</html>
